name: SmsBox
options:
  bundleIdPrefix: com.smsbox
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
targets:
  SmsBox:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 短信盒子
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 需要的系统权限：提前声明，首次用到时系统弹授权框
        NSMicrophoneUsageDescription: 语音通话需要使用麦克风（网页与设备、网页与网页通话）。
        NSCameraUsageDescription: 视频通话功能可能需要使用摄像头。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smsbox.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
